# Private daemon. Never publish port 3310 to customers or the internet.
Foreground yes
TCPSocket 3310
TCPAddr 0.0.0.0
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
LogTime yes
LogClean no
ExtendedDetectionInfo no
MaxThreads 2
MaxQueue 8
ReadTimeout 30
CommandReadTimeout 10
SendBufTimeout 500
StreamMaxLength 1M
MaxFileSize 2M
MaxScanSize 16M
MaxRecursion 8
MaxFiles 256
MaxScanTime 20000
ScanPDF yes
ScanOLE2 yes
ScanArchive yes
ScanXMLDOCS yes
ScanHTML yes
HeuristicAlerts yes
AlertEncrypted yes
AlertExceedsMax yes
AlertOLE2Macros yes
ConcurrentDatabaseReload no
SelfCheck 60
