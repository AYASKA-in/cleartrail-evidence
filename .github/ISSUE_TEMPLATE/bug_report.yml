name: Bug report
description: Report a reproducible non-sensitive defect
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, follow SECURITY.md. Never include credentials, customer evidence or personal/account inventories. Use synthetic data."
  - type: input
    id: version
    attributes:
      label: Version and environment
      description: ClearTrail version/commit, OS, Python and local or hosted mode
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps and synthetic configuration with all secrets removed
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Optional error codes or relevant test output; remove tokens, headers and sensitive data
